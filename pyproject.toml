[project]
name = "server-forecast-platform"
version = "0.1.0"
description = "AI-powered server monitoring and forecasting platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "influxdb-client>=1.43",
    "statsmodels>=0.14",
    "mlflow>=2.11",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]